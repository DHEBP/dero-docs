name: Sync MCP docs bundle

# After dero-docs merges to main, notify dero-mcp-server to open a refresh PR.
# A narrowly installed GitHub App replaces the old long-lived personal token.

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint dero-mcp-server token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MCP_SYNC_APP_ID }}
          private-key: ${{ secrets.MCP_SYNC_APP_PRIVATE_KEY }}
          owner: DHEBP
          repositories: dero-mcp-server

      - name: Trigger dero-mcp-server docs bundle refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg ref "$DOCS_SHA" \
            '{event_type:"dero-docs-updated",client_payload:{ref:$ref}}' \
          | gh api --method POST repos/DHEBP/dero-mcp-server/dispatches --input -

      - name: Report sync failure
        if: failure()
        run: |
          {
            echo "## ❌ MCP docs-sync dispatch failed"
            echo ""
            echo "**dero-docs commit:** \`${{ github.sha }}\`"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "dero-mcp-server was NOT notified — no refresh PR will open for this push."
            echo "Most likely: the MCP sync GitHub App is not installed, or its App ID/private key is missing."
            echo "Recover: re-run, or manually trigger 'Refresh docs bundle' on dero-mcp-server."
          } >> "$GITHUB_STEP_SUMMARY"
